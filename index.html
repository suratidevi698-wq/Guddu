<style>
*{box-sizing:border-box;margin:0;padding:0} :root{color-scheme:dark;--blue:#36c5ff;--purple:#8b5cf6;--white:#f7f8ff}
body{min-height:100vh;display:grid;place-items:center;padding:24px;overflow-x:hidden;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--white);background:radial-gradient(ellipse at 15% 15%,rgba(54,197,255,.17),transparent 36%),radial-gradient(ellipse at 85% 85%,rgba(139,92,246,.20),transparent 38%),#080b1a}
.glow{position:fixed;width:280px;height:280px;border-radius:50%;filter:blur(90px);opacity:.25;pointer-events:none}.glow.one{background:#168dff;top:-100px;left:-90px}.glow.two{background:#873cff;right:-100px;bottom:-100px}
.card{position:relative;width:min(100%,430px);padding:42px 28px 30px;text-align:center;border:1px solid rgba(151,177,255,.22);border-radius:28px;background:linear-gradient(145deg,rgba(24,32,62,.88),rgba(12,16,37,.91));box-shadow:0 24px 80px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(18px)}
.tag{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;margin-bottom:27px;border:1px solid rgba(54,197,255,.35);border-radius:999px;color:#a8e7ff;background:rgba(54,197,255,.08);font-size:11px;font-weight:800;letter-spacing:2px}.tag:before,.tag:after{content:"✦";color:var(--blue)}
.logo-wrap{width:142px;height:142px;margin:0 auto 27px;padding:5px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple),#e879f9);box-shadow:0 0 30px rgba(54,197,255,.32),0 0 55px rgba(139,92,246,.20)}.logo{display:block;width:100%;height:100%;object-fit:cover;border:4px solid #11162d;border-radius:50%}
h1{margin-bottom:13px;font-size:clamp(25px,7vw,32px);line-height:1.15;font-weight:900;letter-spacing:-.8px}h1 span{color:transparent;background:linear-gradient(90deg,#59d6ff,#a78bfa);-webkit-background-clip:text;background-clip:text}
.description{max-width:330px;margin:0 auto 29px;color:#b8c1dc;font-size:14px;line-height:1.75}.join-btn{display:flex;justify-content:center;align-items:center;gap:11px;width:100%;min-height:58px;padding:15px 20px;border:0;border-radius:15px;color:#07101f;background:linear-gradient(100deg,#49d5ff,#8d8bff 58%,#bd83ff);box-shadow:0 10px 28px rgba(69,157,255,.28);font-size:15px;font-weight:900;letter-spacing:.7px;text-decoration:none;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease}.join-btn:hover{transform:translateY(-3px);box-shadow:0 15px 34px rgba(69,157,255,.4)}.join-btn:active{transform:scale(.98)}.telegram-icon{font-size:21px}.hint{margin-top:17px;color:#8792b2;font-size:12px}.footer{margin-top:32px;padding-top:20px;border-top:1px solid rgba(151,177,255,.13);color:#7f8aa9;font-size:10px;font-weight:800;letter-spacing:2px}
@media(max-width:380px){.card{padding:34px 21px 25px}.logo-wrap{width:124px;height:124px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style>

<body>
<div class="glow one"></div><div class="glow two"></div>
<main class="card"><div class="tag">OFFICIAL COMMUNITY</div>
<div class="logo-wrap"><img class="logo" src="https://i.postimg.cc/yNZPpc3p/F92D9E80-9F85-4779-ADAA-188FED17F989.jpg" alt="Community logo"></div>
<h1>JOIN OUR <span>TELEGRAM</span></h1>
<p class="description">Become a part of our official community. Join Telegram to receive the latest updates and announcements.</p>
<a class="join-btn" id="joinTelegram" href="https://t.me/+CZR-8MabKPZmNGQ9"><span class="telegram-icon">✈</span>JOIN TELEGRAM NOW</a>
<p class="hint">Click above to continue to Telegram</p><div class="footer">OFFICIAL TELEGRAM COMMUNITY</div></main>
<noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1155452496925369&ev=PageView&noscript=1" alt=""></noscript>
<script>
(function(){
 const button=document.getElementById('joinTelegram');let redirected=false;
 function goToTelegram(){if(redirected)return;redirected=true;window.location.assign(button.href);}
 button.addEventListener('click',function(event){
  event.preventDefault();if(redirected)return;
  // Fallback sends the visitor to Telegram even if Pixel is blocked.
  const fallback=window.setTimeout(goToTelegram,2000);
  if(typeof window.fbq==='function'){
   try{
    window.fbq('track','Lead',{}, {eventCallback:function(){window.clearTimeout(fallback);goToTelegram();},eventTimeout:1800});
    window.fbq('trackCustom','TelegramJoinClick');
   }catch(err){window.clearTimeout(fallback);goToTelegram();}
  }else{window.clearTimeout(fallback);goToTelegram();}
 });
})();
</script>
